name: CI

on:
  # PR branches run once via pull_request; main runs after merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration history is append-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject edits to existing migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-status --diff-filter=DMRT "$BASE_SHA" HEAD -- apps/api/drizzle ':(exclude)apps/api/drizzle/meta')
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations are append-only. Add a new forward migration instead:"
            echo "$changed"
            exit 1
          fi

  node:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      RUN_DB_TESTS: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check agent skill synchronization
        run: node scripts/sync-agent-skills.mjs --check
      - name: Check first-party engineering workflow
        run: node scripts/check-engineering-workflow.mjs
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:verification
      - run: pnpm lint
      - run: pnpm test
      # next-env.d.ts references generated route types on a fresh checkout.
      - run: pnpm build
      - run: pnpm typecheck

  integration:
    name: PostgreSQL financial integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech
          POSTGRES_DB: fintech_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fintech:fintech@localhost:5432/fintech_ci
      # Administrative fixture access is confined to this disposable service.
      MIGRATION_ADMIN_URL: postgres://fintech:fintech@localhost:5432/postgres
      RUN_DB_TESTS: '1'
      RUN_MIGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Services are constructed directly: no Redis, RabbitMQ, seed or Stripe calls.
      - run: pnpm test:integration
